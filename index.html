<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mary AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(38,38,51,0.18); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(38,38,51,0.3); }
    [data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); }
    [data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    * { scrollbar-width: thin; }

    :root {
      --bg: #ffffff;
      --bg-page: #f5f5f5;
      --bg-surface: #f7f7f7;
      --bg-card: rgba(247,247,247,0.5);
      --text: #262633;
      --text-muted: rgba(38,38,51,0.5);
      --text-ghost: rgba(38,38,51,0.3);
      --border: rgba(38,38,51,0.06);
      --border-strong: rgba(38,38,51,0.12);
      --user-bubble: rgba(38,38,51,0.06);
      --hover: rgba(38,38,51,0.04);
      --input-bg: rgba(247,247,247,0.5);
      --shadow: rgba(38,38,51,0.1);
    }
    [data-theme="dark"] {
      --bg: #1a1a1a;
      --bg-page: #0d0d0d;
      --bg-surface: #262626;
      --bg-card: #1f1f1f;
      --text: #e8e8e8;
      --text-muted: #8a8a8a;
      --text-ghost: #5a5a5a;
      --border: rgba(255,255,255,0.06);
      --border-strong: rgba(255,255,255,0.1);
      --user-bubble: #2a2a2a;
      --hover: rgba(255,255,255,0.05);
      --input-bg: #262626;
      --shadow: rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

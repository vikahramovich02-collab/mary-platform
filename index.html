<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mary AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    ::-webkit-scrollbar { width: 2px; height: 2px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.2);
      border-radius: 2px;
      min-height: 20px; max-height: 20px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.35); }
    ::-webkit-scrollbar-corner { background: transparent; }
    * { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.2) transparent; }

    :root {
      --bg: #ffffff;
      --bg-page: #f5f5f5;
      --bg-surface: #f7f7f7;
      --bg-card: rgba(247,247,247,0.5);
      --text: #262633;
      --text-muted: rgba(38,38,51,0.5);
      --text-ghost: rgba(38,38,51,0.3);
      --border: rgba(38,38,51,0.06);
      --border-strong: rgba(38,38,51,0.12);
      --user-bubble: rgba(38,38,51,0.06);
      --hover: rgba(38,38,51,0.04);
      --input-bg: rgba(247,247,247,0.5);
      --shadow: rgba(38,38,51,0.1);
    }
    [data-theme="dark"] {
      --bg: #1e1e24;
      --bg-page: #18181c;
      --bg-surface: #252530;
      --bg-card: rgba(255,255,255,0.04);
      --text: #e8e8ef;
      --text-muted: rgba(232,232,239,0.5);
      --text-ghost: rgba(232,232,239,0.28);
      --border: rgba(255,255,255,0.07);
      --border-strong: rgba(255,255,255,0.12);
      --user-bubble: rgba(255,255,255,0.07);
      --hover: rgba(255,255,255,0.04);
      --input-bg: rgba(255,255,255,0.05);
      --shadow: rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
